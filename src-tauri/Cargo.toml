[package]
name = "glance"
version = "0.7.0"
description = "Glance — fast, minimal Markdown reader and editor"
authors = ["DSI Innovations, LLC"]
license = "0BSD"
repository = "https://github.com/DSI-codebase/Glance"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }

# Dragging a document out of the window as a real file (Windows' DoDragDrop).
# Windows-only because Glance ships nowhere else, and the crate's macOS and
# Linux halves would otherwise compile for nothing.
[target.'cfg(windows)'.dependencies]
drag = "2.1.1"

# Small binary, fast startup.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
